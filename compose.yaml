name: clientscope

services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in compose.env}
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in compose.env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in compose.env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in compose.env}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:?Set AUTH_THROTTLE_LIMIT in compose.env}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:?Set EMAIL_DELIVERY_MODE in compose.env}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ClientScope}
      PRIVATE_ASSET_STORAGE_MODE: ${PRIVATE_ASSET_STORAGE_MODE:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-}
      DEMO_OWNER_EMAIL: ${DEMO_OWNER_EMAIL:-}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-}
      DEMO_APPROVER_EMAIL: ${DEMO_APPROVER_EMAIL:-}
      DEMO_APPROVER_PASSWORD: ${DEMO_APPROVER_PASSWORD:-}
      DEMO_RESET_SECRET: ${DEMO_RESET_SECRET:-}
      DEMO_CLOUDINARY_FOLDER: ${DEMO_CLOUDINARY_FOLDER:-}
      DEMO_EMAILS_PER_USER_HOUR: ${DEMO_EMAILS_PER_USER_HOUR:-3}
      DEMO_AI_REQUESTS_PER_USER_HOUR: ${DEMO_AI_REQUESTS_PER_USER_HOUR:-10}
      DEMO_UPLOAD_MIB_PER_USER_HOUR: ${DEMO_UPLOAD_MIB_PER_USER_HOUR:-20}
      DEMO_EMAILS_PER_DAY: ${DEMO_EMAILS_PER_DAY:-30}
      DEMO_AI_REQUESTS_PER_DAY: ${DEMO_AI_REQUESTS_PER_DAY:-100}
      DEMO_UPLOAD_MIB_PER_DAY: ${DEMO_UPLOAD_MIB_PER_DAY:-250}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_API_ORIGIN: http://backend:4000
        FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in compose.env}
        PUBLIC_ORIGIN_MODE: local
    environment:
      BACKEND_API_ORIGIN: http://backend:4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in compose.env}
      PUBLIC_ORIGIN_MODE: local
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
